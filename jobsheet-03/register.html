<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Register Member</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">&#9776;</label>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books/list.html">Book List</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Register as New Member</h2>
            <p>Join the library to start borrowing books.</p>
        </section>

        <section>
            <form action="#" method="POST">
                
                <div style="margin-bottom: 1.25rem;">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div style="margin-bottom: 1.25rem;">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <button type="submit">Submit Registration</button>
                
                <p style="margin-top: 1.5rem; font-size: 0.9rem; text-align: center;">
                    Already a member? <a href="#" style="color: #1d5b8a; font-weight: bold; text-decoration: none;">Login here</a>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 4</p>
    </footer>
</body>
</html>
